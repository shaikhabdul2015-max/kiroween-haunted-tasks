<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎃 Kiroween Apex v8.0</title>
  <link rel="stylesheet" href="style.css?v=8.3">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff6b00">
</head>
<body data-theme="haunted">
  <canvas id="fxCanvas"></canvas>
  <div class="container">
    <header>
      <div class="top-bar">
        <span id="rankBadge" class="badge">Lv.1 🕯️ Novice</span>
        <div class="top-controls">
          <span id="streakBadge" class="streak-badge">🔥 1d</span>
          <button class="icon-btn" onclick="cycleView()" id="viewToggleBtn">🗂️ Board</button>
          <button class="icon-btn" onclick="cycleTheme()">🎨</button>
          <button id="soundToggle" class="icon-btn" onclick="toggleSound()">🔊</button>
        </div>
      </div>
      <h1>🎃 Kiroween Apex v8.0 👻</h1>
      <div class="xp-container">
        <div class="xp-info"><span>Soul Power (XP)</span><span id="xpText">0 / 200 XP</span></div>
        <div class="xp-bar"><div id="xpFill"></div></div>
      </div>
      <div id="trophyRow" class="trophy-row"></div>
    </header>
    <div class="heatmap-card">
      <div class="hm-header"><small>📊 7-DAY VELOCITY & HEATMAP</small><small id="todayCount">Today: 0</small></div>
      <div id="heatmapGrid" class="heatmap-grid"></div>
    </div>
    <div class="workspace-tabs">
      <button class="tab-btn active" onclick="setWorkspace('all', this)">🌌 All</button>
      <button class="tab-btn" onclick="setWorkspace('coding', this)">💻 Code</button>
      <button class="tab-btn" onclick="setWorkspace('study', this)">📚 Study</button>
      <button class="tab-btn" onclick="setWorkspace('personal', this)">🏠 Life</button>
    </div>
    <div class="pomo-card">
      <div class="pomo-left"><small>🕯️ FOCUS RITUAL (25m = +150 XP)</small><div id="pomoDisplay">25:00</div></div>
      <div class="pomo-actions"><button id="pomoStartBtn" onclick="togglePomo()">▶ Start</button><button class="sec-mini" onclick="resetPomo()">↺</button></div>
    </div>
    <div class="analytics-card">
      <canvas id="progressChart" width="76" height="76"></canvas>
      <div class="stats">
        <div class="stat-box"><span id="totalCount">0</span><small>Total</small></div>
        <div class="stat-box"><span id="activeCount">0</span><small>Cursed</small></div>
        <div class="stat-box"><span id="doneCount">0</span><small>Exorcised</small></div>
      </div>
    </div>
    <div class="input-group">
      <div class="voice-row"><input type="text" id="taskInput" placeholder="Try: 'Fix bug 15m !doom #coding' or 🎙️"><button id="voiceBtn" class="voice-btn" onclick="startVoiceInput()">🎙️</button></div>
      <div class="row">
        <select id="workspaceSelect"><option value="coding">💻 Coding</option><option value="study">📚 Study</option><option value="personal">🏠 Personal</option></select>
        <select id="prioritySelect"><option value="minor">🕯️ Minor (+25)</option><option value="hex">🔮 Hex (+50)</option><option value="doom">💀 Doom (+100)</option></select>
        <select id="timerSelect"><option value="0">⏳ None</option><option value="1">⏱️ 1m</option><option value="15">⏱️ 15m</option><option value="60">⏱️ 1h</option></select>
      </div>
      <button class="primary-btn" onclick="addTask()">⚡ Smart Summon</button>
    </div>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="🔍 Search..." oninput="renderTasks()">
      <select id="filterSelect" onchange="renderTasks()"><option value="all">All</option><option value="active">Active</option><option value="done">Exorcised</option><option value="doom">Doom</option></select>
    </div>
    <div id="taskContainer"><ul id="taskList"></ul></div>
    <div class="footer-actions">
      <button class="sec-btn" onclick="shareBoard()">🔗 Share</button>
      <button class="sec-btn" onclick="copyReport()">📋 Report</button>
      <button class="sec-btn" onclick="exportCSV()">📊 CSV</button>
      <button class="sec-btn" onclick="exportData()">⬇️ JSON</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>
  <script src="script.js?v=8.4"></script>
</body>
</html>
